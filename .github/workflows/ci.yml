name: iOS CI - Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔨 Build and run tests
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          iphones=[d for devs in data['devices'].values() for d in devs if d['isAvailable'] and 'iPhone' in d['name']]
          print(iphones[-1]['udid'])
          ")
          echo "Using simulator: $SIMULATOR"
          xcodebuild test \
            -project FPLViewer.xcodeproj \
            -scheme FPLViewer \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
