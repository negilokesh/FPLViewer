name: iOS CI - Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 🔨 Build and run tests
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "^\s*iPhone" | tail -1 | sed 's/^\s*//' | sed 's/ (.*//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project FPLViewer.xcodeproj \
            -scheme FPLViewer \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
